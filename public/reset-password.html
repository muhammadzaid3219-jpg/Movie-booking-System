<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a New Password - Cineplex</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap-slim">
    <h1 style="text-align:center">Set a new password</h1>
    <p class="sub center">Choose something you have not used before.</p>
    <div id="out"><div class="card"><div class="sk sk-row"></div></div></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const token = qs('token');

    function showForm() {
      $('#out').innerHTML = `
        <form class="card" id="form" novalidate>
          <div id="err"></div>
          <div class="field">
            <label for="p1">New password</label>
            <input type="password" id="p1" autocomplete="new-password" required minlength="6">
            <div class="hint">At least 6 characters.</div>
          </div>
          <div class="field">
            <label for="p2">Confirm new password</label>
            <input type="password" id="p2" autocomplete="new-password" required>
          </div>
          <button class="btn block" type="submit" id="save">Update password</button>
        </form>`;

      $('#form').addEventListener('submit', (e) => {
        e.preventDefault();
        const p1 = $('#p1').value, p2 = $('#p2').value;
        const fail = (m) => { $('#err').innerHTML = `<div class="alert err">${esc(m)}</div>`; };

        $('#err').innerHTML = '';
        if (p1.length < 6) return fail('Password must be at least 6 characters');
        if (p1 !== p2) return fail('The two passwords do not match');

        withBusy($('#save'), 'Saving', async () => {
          try {
            const r = await api('/api/auth/reset-password', { method: 'POST', body: { token, password: p1 } });
            $('#out').innerHTML = `
              <div class="card center">
                <div style="font-size:34px">&#10003;</div>
                <h3 style="margin:10px 0 6px">Password updated</h3>
                <p class="muted">${esc(r.message)}</p>
                <a class="btn block" href="login.html" style="margin-top:14px">Go to login</a>
              </div>`;
          } catch (err) { fail(err.message); }
        });
      });
    }

    function showInvalid(message) {
      $('#out').innerHTML = `
        <div class="card center">
          <div style="font-size:34px">&#9203;</div>
          <h3 style="margin:10px 0 6px">This link is no longer valid</h3>
          <p class="muted">${esc(message)}</p>
          <a class="btn block" href="login.html" style="margin-top:14px">Request a new link</a>
        </div>`;
    }

    (async () => {
      await renderNav();
      renderFooter();

      if (!token) return showInvalid('No reset token was supplied.');

      try {
        const r = await api('/api/auth/reset-password/' + encodeURIComponent(token));
        if (r.valid) showForm();
        else showInvalid('Reset links expire after a short while and can only be used once.');
      } catch (e) {
        showInvalid(e.message);
      }
    })();
  </script>
</body>
</html>
